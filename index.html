<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HOMA • New Year 2026 Countdown</title>

<style>
  :root{
    --bg1:#081c24;
    --bg2:#0b2b34;
    --gold1:#d8b56a;
    --gold2:#f4e3b0;
    --white:rgba(255,255,255,.92);
    --muted:rgba(255,255,255,.68);

    /* Elegant digit tiles */
    --tileA: rgba(18, 24, 28, .72);
    --tileB: rgba(18, 24, 28, .46);
    --tileBorder: rgba(255,255,255,.14);
    --tileLine: rgba(255,255,255,.10);
    --shadow: rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{
    margin:0; height:100vh; overflow:hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--white);
    background: radial-gradient(1200px 800px at 20% 20%, rgba(216,181,106,.18), transparent 55%),
                radial-gradient(900px 700px at 80% 30%, rgba(244,227,176,.12), transparent 60%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
    display:flex; align-items:center; justify-content:center;
  }

  .glow{
    position:absolute; inset:-40%;
    background:
      radial-gradient(closest-side at 30% 40%, rgba(216,181,106,.14), transparent 60%),
      radial-gradient(closest-side at 70% 60%, rgba(244,227,176,.10), transparent 60%);
    filter: blur(30px);
    animation: drift 18s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes drift{
    from{ transform: translate3d(-2%, -1%, 0) scale(1.05); }
    to  { transform: translate3d( 2%,  1%, 0) scale(1.08); }
  }

  .card{
    position:relative;
    width:min(980px, 92vw);
    padding: clamp(28px, 4vw, 54px);
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.14);
    box-shadow:
      0 20px 60px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter: blur(10px);
    text-align:center;
  }

  .sparkles{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.65), transparent 60%),
      radial-gradient(1px 1px at 30% 70%, rgba(244,227,176,.55), transparent 60%),
      radial-gradient(2px 2px at 70% 25%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 85% 60%, rgba(216,181,106,.55), transparent 60%),
      radial-gradient(2px 2px at 50% 85%, rgba(255,255,255,.50), transparent 60%);
    opacity:.55;
    animation: twinkle 4.8s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.45; }
    50%{ opacity:.70; }
  }

  .confetti{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 600ms ease;
  }
  .confetti.on{ opacity:1; }
  .confetti::before, .confetti::after{
    content:"";
    position:absolute; inset:-20%;
    background:
      radial-gradient(3px 3px at 12% 18%, rgba(216,181,106,.95), transparent 55%),
      radial-gradient(3px 3px at 25% 65%, rgba(244,227,176,.90), transparent 55%),
      radial-gradient(3px 3px at 55% 30%, rgba(255,255,255,.85), transparent 55%),
      radial-gradient(3px 3px at 78% 42%, rgba(216,181,106,.90), transparent 55%),
      radial-gradient(3px 3px at 88% 72%, rgba(244,227,176,.85), transparent 55%);
    filter: blur(.2px);
    animation: fall 2.8s linear infinite;
  }
  .confetti::after{
    animation-duration: 3.3s;
    opacity:.75;
  }
  @keyframes fall{
    from{ transform: translateY(-6%); }
    to  { transform: translateY(6%); }
  }

  .topline{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 22px;
  }
  .logo{
    width: clamp(180px, 22vw, 280px);
    opacity:0;
    transform: translateY(6px);
    animation: fadeUp 1.6s ease forwards;
  }
  @keyframes fadeUp{
    to{ opacity:1; transform: translateY(0); }
  }

  .divider{
    height:1px;
    width:min(680px, 86%);
    margin: 22px auto 26px;
    background: linear-gradient(90deg, transparent, rgba(216,181,106,.65), transparent);
    opacity:.9;
  }

  .title{
    font-size: clamp(16px, 2.2vw, 20px);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .main{
    font-variant-numeric: tabular-nums;
    font-size: clamp(44px, 6.6vw, 92px);
    letter-spacing: .22em;
    font-weight: 300;
    line-height: 1.05;
    text-shadow: 0 8px 30px rgba(0,0,0,.35);
    margin-bottom: 10px;
  }

  /* ✅ Elegant digit tiles (circled area) */
  .strip{
    margin: 14px auto 8px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .group{
    min-width: 120px;
  }
  .digits{
    display:flex;
    gap: 10px;
    justify-content:center;
  }

  .digit{
    width: clamp(44px, 5.2vw, 78px);
    height: clamp(64px, 6.8vw, 98px);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--tileA), var(--tileB));
    border: 1px solid var(--tileBorder);
    box-shadow: 0 18px 45px var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: clamp(34px, 4.8vw, 66px);
    font-weight: 300;
    position:relative;
    overflow:hidden;
  }
  .digit::after{
    content:"";
    position:absolute;
    left: 10px; right: 10px;
    top: 50%;
    height: 1px;
    background: var(--tileLine);
  }

  /* subtle gold accent on edges */
  .digit::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius: 14px;
    box-shadow: inset 0 0 0 1px rgba(216,181,106,.10);
    pointer-events:none;
  }

  .label{
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: .22em;
    color: rgba(255,255,255,.62);
    text-transform: uppercase;
  }

  .sub{
    margin-top: 18px;
    font-size: clamp(14px, 2.0vw, 18px);
    letter-spacing: .22em;
    color: rgba(255,255,255,.62);
    text-transform: uppercase;
  }

  .hint{
    margin-top: 10px;
    font-size: 13px;
    color: rgba(255,255,255,.45);
    letter-spacing: .08em;
  }

  .shimmer{
    background: linear-gradient(90deg, var(--gold1), var(--gold2), var(--gold1));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip:text;
    color: transparent;
    animation: shine 2.4s linear infinite;
    font-weight: 400;
  }
  @keyframes shine{
    from{ background-position: 0% 50%; }
    to  { background-position: 200% 50%; }
  }
</style>
</head>

<body>
  <div class="glow"></div>

  <div class="card">
    <div class="sparkles"></div>
    <div class="confetti" id="confetti"></div>

    <div class="topline">
      <img class="logo" src="logo.png" alt="HOMA Logo">
    </div>

    <div class="divider"></div>

    <div class="title" id="title">Countdown New Year</div>
    <div class="main" id="mainText">SYNCING…</div>

    <div class="strip" aria-label="countdown tiles">
      <div class="group">
        <div class="digits">
          <div class="digit" id="dd1">0</div>
          <div class="digit" id="dd2">0</div>
        </div>
        <div class="label">days</div>
      </div>

      <div class="group">
        <div class="digits">
          <div class="digit" id="hh1">0</div>
          <div class="digit" id="hh2">0</div>
        </div>
        <div class="label">hours</div>
      </div>

      <div class="group">
        <div class="digits">
          <div class="digit" id="mm1">0</div>
          <div class="digit" id="mm2">0</div>
        </div>
        <div class="label">minutes</div>
      </div>

      <div class="group">
        <div class="digits">
          <div class="digit" id="ss1">0</div>
          <div class="digit" id="ss2">0</div>
        </div>
        <div class="label">seconds</div>
      </div>
    </div>

    <div class="sub">Thailand Time (UTC+7)</div>
    <div class="hint" id="hint">Counting down to 01/01/2026 00:00 (TH)</div>
  </div>

<script>
/**
 * ✅ เวลาไทย "แม่น" ด้วยการดึงเวลาจากออนไลน์ (Bangkok) แล้วค่อยนับต่อด้วย performance.now()
 * - เป้าหมาย: 01/01/2026 00:00:00 (เวลาไทย)
 * - ถ้าดึงออนไลน์ไม่ได้: fallback ใช้เวลาเครื่อง (จะยังทำงานได้)
 */

const TARGET_MS = Date.parse("2026-01-01T00:00:00+07:00");

const $ = (id) => document.getElementById(id);

function pad2(n){ return String(n).padStart(2,'0'); }
function setPair(a,b,val){
  const s = pad2(val);
  $(a).textContent = s[0];
  $(b).textContent = s[1];
}
function setDays2(val){
  const s = String(val).padStart(2,'0').slice(-2);
  $("dd1").textContent = s[0];
  $("dd2").textContent = s[1];
}
function applyDiff(diffMs){
  if (diffMs < 0) diffMs = 0;
  const totalSeconds = Math.floor(diffMs / 1000);
  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  setDays2(days);
  setPair("hh1","hh2", hours);
  setPair("mm1","mm2", minutes);
  setPair("ss1","ss2", seconds);
}

// ----- Online time sync -----
let baseServerMs = null;
let basePerfMs = null;

function nowServerMs(){
  if (baseServerMs === null || basePerfMs === null) return null;
  return baseServerMs + (performance.now() - basePerfMs);
}

function setFinished(){
  $("title").textContent = "HOMA";
  $("mainText").textContent = "HAPPY NEW YEAR";
  $("mainText").classList.add("shimmer");
  $("hint").textContent = "Welcome 2026";
  $("confetti").classList.add("on");
  applyDiff(0);
}

function setRunning(){
  $("mainText").classList.remove("shimmer");
  $("mainText").textContent = "2026";
  $("hint").textContent = "Counting down to (Thailand Time) 01/01/2026 00:00 <Created by Dodo>";
  $("confetti").classList.remove("on");
}

async function syncTime(){
  try{
    $("mainText").classList.remove("shimmer");
    $("mainText").textContent = "SYNCING…";
    $("hint").textContent = "Syncing Thailand time (online)…";

    const res = await fetch("https://worldtimeapi.org/api/timezone/Asia/Bangkok", { cache: "no-store" });
    if(!res.ok) throw new Error("Time server not available");
    const data = await res.json();

    const serverMs = (typeof data.unixtime === "number")
      ? data.unixtime * 1000
      : Date.parse(data.datetime);

    baseServerMs = serverMs;
    basePerfMs = performance.now();

    $("hint").textContent = "Synced ✓ Thailand Time (online)";
    tick(); // immediate update
  } catch (e){
    // fallback
    baseServerMs = Date.now();
    basePerfMs = performance.now();
    $("hint").textContent = "Using device time (fallback)";
  }
}

function tick(){
  const now = nowServerMs() ?? Date.now();
  const diff = TARGET_MS - now;

  if (diff <= 0){
    setFinished();
    return;
  }

  setRunning();
  applyDiff(diff);
}

syncTime();
setInterval(tick, 1000);
// Re-sync every 10 minutes to minimize drift
setInterval(syncTime, 10 * 60 * 1000);
</script>
</body>
</html>
